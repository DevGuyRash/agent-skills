[package]
name = "split-test"
version = "2.0.0"
edition = "2021"
publish = false

[[bin]]
name = "split-test"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.23"

[lints]
workspace = true
